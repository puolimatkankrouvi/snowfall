version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "@angular/**"
        versions:
          - ">=22.0.0"
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"
    groups:
      frontend:
        patterns:
          - "*"
